[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dchan"
version = "0.1.0"
description = "Optimal experimental design API and web application"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.100,<1",
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "pydantic>=1.10,<3",
    "uvicorn[standard]>=0.23,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.urls]
Repository = "https://github.com/tanakakao/dchan"

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "functions*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["application", "functions"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
