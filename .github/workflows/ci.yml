name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project and development dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Lint backend and tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev ruff check application tests

      - name: Run backend tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev pytest --cov=application --cov=functions --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build
