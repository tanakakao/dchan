name: Validate pnpm migration

on:
  push:
    branches:
      - agent/migrate-web-to-pnpm
    paths:
      - "frontend/**"
      - ".github/workflows/_pnpm-lock-temp.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false
      - name: Refresh lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "Update pnpm lockfile"
          git push
